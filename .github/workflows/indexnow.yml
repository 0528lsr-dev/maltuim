# 새 글·바뀐 페이지를 push 하면 Bing(ChatGPT 검색)·네이버에 바로 알림 (IndexNow)
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:
    inputs:
      all:
        description: '1 이면 sitemap.xml 의 모든 주소 전송'
        default: '0'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 주소 모으기
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ github.event.inputs.all }}
        run: |
          SITE=https://seochoedu.co.kr
          if [ "$ALL" = "1" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<\/\?loc>//g' > urls.txt
          else
            git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- '*.html' \
              | grep -v '/_posts/' \
              | sed -e 's#^index\.html$##' -e 's#/index\.html$#/#' \
              | sed "s#^#$SITE/#" > urls.txt
          fi
          sort -u urls.txt -o urls.txt
          cat urls.txt
      - name: 전송 (GitHub Pages 반영 기다린 뒤)
        run: |
          [ -s urls.txt ] || { echo "보낼 주소 없음"; exit 0; }
          sleep 90
          KEY=6c1043d2f8f95d2878f3bb1c90663c33
          BODY=$(python3 -c "import json;u=[l.strip() for l in open('urls.txt') if l.strip()];print(json.dumps({'host':'seochoedu.co.kr','key':'$KEY','keyLocation':'https://seochoedu.co.kr/$KEY.txt','urlList':u}))")
          for EP in https://api.indexnow.org/indexnow https://searchadvisor.naver.com/indexnow; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$EP" -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
            echo "$EP → $CODE"
          done
